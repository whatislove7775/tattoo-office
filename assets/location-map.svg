<title id="title">Tattoo Office · 1–2 минуты от Чернышевской</title>
<desc id="desc">Схема маршрута от метро Чернышевская к Кирочной, 24 через переход на проспекте Чернышевского. Ориентиры: Хлебник, Пятёрочка, ВкусВилл. Маршрут до дома, точный вход уточните перед визитом.</desc>
