<title id="title">Tattoo Office — Кирочная, 24</title><desc id="desc">Схема района: метро Чернышевская к востоку от проспекта Чернышевского, Tattoo Office к западу. Маршрут идёт к Кирочной улице, через переход на проспекте и вдоль дома 24. Ориентиры: ВкусВилл, Хлебник и Пятёрочка. Детали входа уточните перед визитом.</desc>
