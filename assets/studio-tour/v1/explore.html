<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Интерьер · Tattoo Office</title>
  <link rel="author" href="./web/garment-library.json">
  <link rel="preload" href="./web/overview-cutaway.glb" as="fetch" crossorigin>
  <script type="module" crossorigin src="./assets/site-view-C9Br8YNK.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three.core-DqMGOMUf.js">
  <link rel="stylesheet" crossorigin href="./assets/site-view-CxlKvgiV.css">
</head>
<body data-site-tour>
  <main id="viewport" aria-label="Интерактивная карта студии">
    <img id="preview" src="./preview-dollhouse.webp" alt="Общий вид студии">
    <div id="room-points" aria-label="Помещения студии"></div>
  </main>
  <footer>
    <nav aria-label="Управление картой">
      <button id="whole" hidden><span class="back-angle" aria-hidden="true"></span>Вся студия</button>
      <div class="views" role="group" aria-label="Вид карты">
        <button id="orbit" aria-pressed="true" disabled>Объём</button>
        <button id="top" aria-pressed="false" disabled>План</button>
      </div>
      <button id="retry" hidden>Повторить</button>
      <button id="walk" class="inspect" aria-pressed="false" aria-label="Осмотреться" title="Осмотреться" disabled>
        <svg class="inspect-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 9V5A1.5 1.5 0 0 1 5 3.5H9m6 0h4A1.5 1.5 0 0 1 20.5 5v4m0 6v4a1.5 1.5 0 0 1-1.5 1.5h-4m-6 0H5A1.5 1.5 0 0 1 3.5 19v-4"/>
          <path d="M6.5 12s2-3.1 5.5-3.1 5.5 3.1 5.5 3.1-2 3.1-5.5 3.1S6.5 12 6.5 12Z"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/>
        </svg>
        <svg class="exit-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </nav>
    <p id="inspection-instructions" hidden>
      <span class="desktop-controls">Двигайте мышь для обзора. Escape вернёт курсор. WASD или стрелки — идти.</span>
      <span class="touch-controls">Проведите по правой стороне для обзора. Слева потяните в сторону движения.</span>
    </p>
    <div class="caption" role="status"><strong id="room-title" hidden></strong><span id="status">Открываю карту…</span></div>
  </footer>
</body></html>
