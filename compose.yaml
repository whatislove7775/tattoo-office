services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tattoo_office
      POSTGRES_USER: tattoo_office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tattoo_office"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgres://tattoo_office:${POSTGRES_PASSWORD}@db:5432/tattoo_office
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
