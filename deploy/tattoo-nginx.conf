# Tattoo Office is a separate virtual host. Existing hosts remain unchanged.
server {
    listen 80;
    server_name tattoo.193.168.46.161.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tattoo.193.168.46.161.sslip.io;

    ssl_certificate /etc/letsencrypt/live/tattoo.193.168.46.161.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tattoo.193.168.46.161.sslip.io/privkey.pem;

    location /api/ {
        proxy_pass http://172.18.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
