name: Site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log || { grep -E "not ok|Error|expected|actual|AssertionError|at file" /tmp/test.log | head -25 | sed 's/^/::error::/'; exit 1; }
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-foundation.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: /tmp/tattoo-foundation-qa/
