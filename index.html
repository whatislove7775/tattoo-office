<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tattoo Office</title>
<meta name="description" content="Tattoo Office — тату-студия и коворкинг для мастеров. The Tattoo Office Private Club.">
<meta name="theme-color" content="#e8e8e6">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/office.css">
<link rel="stylesheet" href="css/refinements.css">
<link rel="stylesheet" href="css/showcase.css">
<link rel="stylesheet" href="css/controls-refresh.css">
</head>
<body>
<svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="ui-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
  <symbol id="ui-arrow-left" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></symbol>
  <symbol id="ui-arrow-up-right" viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></symbol>
  <symbol id="ui-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="ui-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="ui-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="ui-minus" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>
  <symbol id="ui-reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.2 6M4 5v6h6"/></symbol>
  <symbol id="ui-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
  <symbol id="ui-moon" viewBox="0 0 24 24"><path d="M20.4 15.4A8.6 8.6 0 0 1 8.6 3.6 8.8 8.8 0 1 0 20.4 15.4Z"/></symbol>
</svg>

<!-- ========== шапка: цельная плашка ABOUT + логотип одним корпусом ========== -->
<div class="header" id="siteHeader">
  <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Открыть меню" aria-expanded="false" aria-controls="menu loginPanel"><span></span><span></span><span></span></button>
  <svg class="header__shape" aria-hidden="true" focusable="false">
    <path id="headerShapePath"></path>
  </svg>

  <header class="fringe">
    <div class="fringe__label">ABOUT:</div>
    <div class="marquee" id="marquee">
      <div class="marquee__track" id="marqueeTrack"></div>
    </div>
  </header>

  <div class="brand">
    <a class="brand__logo" href="#/masters" aria-label="Tattoo Office" data-sfx="nav">
      <img src="assets/logo.svg" alt="Tattoo Office">
    </a>

    <div class="brand__controls">
      <div class="lang">
        <button class="lang__btn" data-lang="ru" data-sfx="toggle">ru</button><span class="lang__sep">/</span><button class="lang__btn" data-lang="en" data-sfx="toggle">en</button>
      </div>
      <button class="theme" id="themeToggle" type="button" title="" aria-label="Включить тёмную тему" aria-pressed="false" data-sfx="toggle">
        <span class="theme__track" aria-hidden="true"><span class="theme__knob"></span><svg class="ui-icon theme__sun"><use href="#ui-sun"></use></svg><svg class="ui-icon theme__moon"><use href="#ui-moon"></use></svg></span>
      </button>
    </div>
  </div>
</div>

<!-- ============ основная сцена ============ -->
<main class="stage panel" id="stage" tabindex="-1">
  <div class="stage__inner" id="view"><!-- сюда рендерятся страницы --></div>
</main>

<!-- ============ правая колонка ============ -->
<aside class="rail">
  <nav class="menu" id="menu">
    <svg class="menu__shape" aria-hidden="true" focusable="false">
      <path id="menuShapePath"></path>
    </svg>
    <div class="menu__title" data-i18n="menu.title">Menu:</div>
    <ul class="menu__list" id="menuList"></ul>
  </nav>

  <div class="rent-slider" id="rentSlider">
    <span class="rent-slider__label" aria-hidden="true">slide to rent a place</span>
    <button class="rent-slider__thumb" id="rentSliderThumb" type="button" role="slider" aria-label="Потяните вправо, чтобы забронировать место" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Перетащите вправо" tabindex="0"><svg class="ui-icon"><use href="#ui-arrow-right"></use></svg></button>
  </div>
  <div class="panel login" id="loginPanel"></div>

  <footer class="panel foot">
    <div class="foot__links" id="footLinks"></div>
    <div class="foot__copy">
      <a href="#/about">Tattoo Office</a> / <a href="#/about">The Tattoo Office Private Club</a> <span>2026 ©</span>
    </div>
    <img class="foot__mark" src="assets/mark.svg" alt="">
  </footer>
</aside>

<!-- декоративный скролл-бар в стиле 2010-х -->
<div class="deco-scroll" aria-hidden="true" hidden><div class="deco-scroll__thumb" id="decoThumb"></div></div>

<!-- всплывающие окошки -->
<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__window panel" role="dialog" aria-modal="true">
    <div class="modal__bar">
      <span class="modal__title" id="modalTitle"></span>
      <button class="modal__x" data-close aria-label="close">✕</button>
    </div>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div id="notice" role="status" aria-live="polite" hidden></div>
<dialog id="dialog"><form method="dialog"><button class="close" aria-label="Закрыть">×</button></form><div id="dialog-content"></div></dialog>

<script src="js/sound.js"></script>
<script src="js/placeholder.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>

<script src="js/drift.js"></script>
<script src="js/pages.js"></script>

<script src="js/app.js"></script>
<script src="js/controls.js"></script>
<script src="js/rent-slider.js"></script>
<script src="js/icons.js"></script>
<script src="js/studio-model.js"></script>
<script type="module" src="js/office.js"></script>
</body>
</html>
