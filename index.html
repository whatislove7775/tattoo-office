<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tattoo Office</title>
<meta name="description" content="Tattoo Office — тату-студия и рабочее пространство для мастеров. The Tattoo Office Private Club — клуб постоянных мастеров с особыми условиями аренды.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.svg?v=white-2" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/office.css">
<link rel="stylesheet" href="css/refinements.css">
<link rel="stylesheet" href="css/showcase.css">
<link rel="stylesheet" href="css/controls-refresh.css">
<link rel="stylesheet" href="css/ios5.css">
<link rel="stylesheet" href="css/final-touches.css">
<link rel="stylesheet" href="css/monochrome.css">
</head>
<body>
<svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="ui-arrow-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="ui-arrow-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="ui-arrow-up-right" viewBox="0 0 24 24"><path d="M7 7h10v10"/></symbol>
  <symbol id="ui-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="ui-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="ui-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="ui-minus" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>
  <symbol id="ui-reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.2 6M4 5v6h6"/></symbol>
  <symbol id="ui-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
  <symbol id="ui-moon" viewBox="0 0 24 24"><path d="M20.4 15.4A8.6 8.6 0 0 1 8.6 3.6 8.8 8.8 0 1 0 20.4 15.4Z"/></symbol>
  <symbol id="ui-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="ui-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18M8 14h2m4 0h2m-8 4h2"/></symbol>
  <symbol id="ui-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6M12 7v5l3 2"/></symbol>
  <symbol id="ui-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8a2 2 0 0 0-4-4L4 16Zm10-10 4 4"/></symbol>
  <symbol id="ui-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></symbol>
  <symbol id="ui-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></symbol>
</svg>

<!-- ========== шапка: цельная плашка ABOUT + логотип одним корпусом ========== -->
<div class="header" id="siteHeader">
  <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Открыть меню" aria-expanded="false" aria-controls="menu loginPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="menuMorphPath" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <svg class="header__shape" aria-hidden="true" focusable="false">
    <path id="headerShapePath"></path>
  </svg>

  <header class="fringe">
    <div class="fringe__label">ABOUT:</div>
    <div class="marquee" id="marquee">
      <div class="marquee__track" id="marqueeTrack"></div>
    </div>
  </header>

  <div class="brand">
    <a class="brand__logo" href="#/masters" aria-label="Tattoo Office" data-sfx="nav">
      <img src="assets/logo.svg" alt="Tattoo Office">
    </a>

    <div class="brand__controls">
      <button class="theme" id="themeToggle" type="button" title="" aria-label="Включить тёмную тему" aria-pressed="false" data-sfx="toggle">
        <span class="theme__track" aria-hidden="true"><span class="theme__knob"></span><svg class="ui-icon theme__sun"><use href="#ui-sun"></use></svg><svg class="ui-icon theme__moon"><use href="#ui-moon"></use></svg></span>
      </button>
    </div>
  </div>
</div>

<!-- ============ основная сцена ============ -->
<main class="stage panel" id="stage" tabindex="-1">
  <svg class="stage__shape" aria-hidden="true" focusable="false"><path id="stageShapePath"></path></svg>
  <div class="stage__inner" id="view"><!-- сюда рендерятся страницы --></div>
</main>

<!-- ============ правая колонка ============ -->
<aside class="rail">
  <nav class="menu" id="menu">
    <svg class="menu__shape" aria-hidden="true" focusable="false">
      <path id="menuShapePath"></path>
    </svg>
    <div class="menu__title"><span data-i18n="menu.title">Menu:</span><button id="menuLogout" class="menu-logout" type="button" aria-label="Выйти из аккаунта" title="Выйти из аккаунта" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path id="logoutMorphPath" d="M9 4H4v16h5M9 12h11m-4-4 4 4-4 4"/></svg></button></div>
    <ul class="menu__list" id="menuList"></ul>
  </nav>
  <div class="panel login" id="loginPanel"></div>
</aside>

<div class="site-bottom">
  <div class="rent-slider" id="rentSlider">
    <span class="rent-slider__label" aria-hidden="true">slide to rent a place</span>
    <button class="rent-slider__thumb" id="rentSliderThumb" type="button" role="slider" aria-label="Потяните вправо, чтобы забронировать место" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Перетащите вправо" tabindex="0"><svg class="ui-icon"><use href="#ui-arrow-right"></use></svg></button>
  </div>

  <footer class="panel foot">
    <div class="foot__links" id="footLinks"></div>
    <div class="foot__copy">
      <a href="#/about">Tattoo Office</a><a href="#/club">The Tattoo Office Private Club</a> <span>2026 ©</span>
    </div>
    <img class="foot__mark" src="assets/mark.svg" alt="">
  </footer>
</div>

<!-- декоративный скролл-бар в стиле 2010-х -->
<div class="deco-scroll" aria-hidden="true" hidden><div class="deco-scroll__thumb" id="decoThumb"></div></div>

<!-- всплывающие окошки -->
<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__window panel" role="dialog" aria-modal="true">
    <div class="modal__bar">
      <span class="modal__title" id="modalTitle"></span>
      <button class="modal__x" data-close aria-label="close">✕</button>
    </div>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div id="notice" role="status" aria-live="polite" hidden></div>
<dialog id="dialog"><form method="dialog"><button class="close" aria-label="Закрыть"><svg class="ui-icon" aria-hidden="true"><use href="#ui-close"></use></svg></button></form><div id="dialog-content"></div></dialog>

<script src="js/sound.js"></script>
<script src="js/placeholder.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>

<script src="js/drift.js"></script>
<script src="js/photo-viewer.js"></script>
<script src="js/pages.js"></script>

<script src="js/app.js"></script>
<script src="js/controls.js"></script>
<script src="js/rent-slider.js"></script>
<script src="js/icons.js"></script>
<script type="module" src="js/interface-motion.js"></script>
<script src="js/typography.js"></script>
<script src="js/studio-model.js"></script>
<script type="module" src="js/office.js"></script>
</body>
</html>
